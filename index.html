<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ادمین هوشمند تلگرام | Wygard & AI</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --accent: #3b82f6; 
            --accent-gaming: #8b5cf6; 
            --success: #10b981;
            --border-radius: 12px;
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }
        
        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: var(--border-radius);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        h1 { text-align: center; margin-bottom: 20px; font-size: 1.5rem; color: var(--accent); }
        
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: var(--text-muted); font-size: 0.9rem; }
        
        input, select, textarea {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            border-radius: 8px;
            font-size: 1rem;
            transition: 0.3s;
        }
        
        input:focus, textarea:focus { border-color: var(--accent); }
        
        button {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            margin-top: 10px;
        }
        
        button:hover { background: #2563eb; }
        
        /* Gaming Tab Specific Style */
        .gaming-btn {
            background: var(--accent-gaming);
        }
        .gaming-btn:hover {
            background: #7c3aed;
        }

        button.secondary { background: #334155; margin-top: 5px; }
        button.secondary:hover { background: #475569; }

        .status-bar {
            margin-top: 20px;
            padding: 10px;
            background: #0f172a;
            border-radius: 8px;
            font-size: 0.85rem;
            color: var(--text-muted);
            text-align: center;
            min-height: 40px;
            word-break: break-all;
        }

        .loader {
            display: inline-block;
            width: 12px; height: 12px;
            border: 2px solid var(--text-muted);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 8px;
            vertical-align: middle;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Tab System */
        .tabs { display: flex; margin-bottom: 20px; border-bottom: 1px solid #334155; }
        .tab-btn {
            flex: 1;
            background: transparent;
            color: var(--text-muted);
            border-radius: 0;
            margin-top: 0;
            border-bottom: 2px solid transparent;
            font-size: 0.9rem;
        }
        .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
        .tab-btn.gaming-active { color: var(--accent-gaming); border-bottom-color: var(--accent-gaming); }
        
        .content-section { display: none; }
        .content-section.active { display: block; }

        .file-preview {
            margin-top: 10px;
            font-size: 0.8rem;
            color: var(--success);
            word-break: break-all;
        }
        
        .wigard-result {
            background: #0f172a;
            padding: 10px;
            border-radius: 6px;
            margin-top: 10px;
            font-family: monospace;
            font-size: 0.9rem;
            color: var(--success);
            border: 1px dashed #334155;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🤖 پنل هوشمند تلگرام</h1>

    <!-- Tabs -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('manual')">📝 پست دستی</button>
        <button class="tab-btn" onclick="switchTab('auto')">🧠 اخبار هوشمند</button>
        <button class="tab-btn" id="tab-wigard" onclick="switchTab('wigard')">🛡️ وایگارد گیمینگ</button>
    </div>

    <!-- Manual Post Section -->
    <div id="manual" class="content-section active">
        <div class="input-group">
            <label>متن پست</label>
            <textarea id="postText" rows="3" placeholder="متن خود را اینجا بنویسید..."></textarea>
        </div>
        
        <div class="input-group">
            <label>فایل یا عکس (اختیاری)</label>
            <input type="file" id="postFile" accept="image/*,video/*,document/*">
        </div>

        <div class="input-group">
            <label>زمان انتشار (فرمت: YYYY-MM-DDTHH:mm)</label>
            <input type="datetime-local" id="scheduleTime">
        </div>

        <button onclick="schedulePost()">⏰ تنظیم زمان‌بندی</button>
    </div>

    <!-- Auto News Section -->
    <div id="auto" class="content-section">
        <div class="input-group">
            <label>موضوع خبر (مثلاً: بیتکوین، هوش مصنوعی)</label>
            <input type="text" id="newsTopic" placeholder="عبارت مورد نظر را وارد کنید...">
        </div>

        <div class="input-group">
            <label>API Key NoTrack AI</label>
            <input type="password" id="noTrackKey" placeholder="کلید API خود را وارد کنید">
        </div>

        <button onclick="fetchAndPostNews()" id="newsBtn">🚀 جستجو و انتشار فوری</button>
    </div>

    <!-- Wigard Section -->
    <div id="wigard" class="content-section">
        <div class="input-group">
            <label>لوکیشن (Location)</label>
            <select id="wigardLoc">
                <option value="DE">🇩🇪 آلمان (Germany - Low Ping)</option>
                <option value="NL">🇳🇱 هلند (Netherlands)</option>
                <option value="GB">🇬🇧 انگلیس (UK)</option>
                <option value="US">🇺🇸 آمریکا (USA)</option>
            </select>
        </div>

        <div class="input-group">
            <label>مدت زمان (Interval in Minutes)</label>
            <input type="number" id="wigardInterval" value="10" min="1" max="60">
        </div>

        <div class="input-group">
            <label>وضعیت</label>
            <div style="display:flex; align-items:center; gap:10px;">
                <input type="checkbox" id="autoWigard" style="width:auto;"> 
                <label for="autoWigard" style="margin:0; color:white;">ساخت خودکار هر X دقیقه</label>
            </div>
        </div>

        <button class="gaming-btn" onclick="createWigard(true)">🎮 ساخت و ارسال فایل .conf</button>
        <button class="secondary gaming-btn" onclick="toggleAutoWigard()">🔄 فعال‌سازی دوره‌ای</button>
        
        <div id="wigardStatusBox" class="wigard-result" style="display:none;"></div>
    </div>

    <!-- Settings & Status -->
    <div class="input-group" style="margin-top: 20px;">
        <label>Bot Token (تلگرام)</label>
        <input type="password" id="botToken" placeholder="123456:ABC-DEF...">
    </div>
    
    <div class="input-group">
        <label>Channel ID (با @ شروع شود)</label>
        <input type="text" id="channelId" placeholder="@YourChannelID">
    </div>

    <div class="status-bar" id="statusMsg">آماده برای اجرا...</div>
</div>

<script>
    // --- Configuration ---
    const TELEGRAM_API = "https://api.telegram.org/bot";
    let autoWigardInterval = null;

    // --- Helper Functions ---
    function setStatus(msg, loading = false) {
        const el = document.getElementById('statusMsg');
        el.innerHTML = loading ? `${msg} <span class="loader"></span>` : msg;
    }

    function switchTab(tabName) {
        document.querySelectorAll('.content-section').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        
        if(tabName === 'wigard') {
            document.getElementById('tab-wigard').classList.add('gaming-active');
        } else {
             document.getElementById('tab-wigard').classList.remove('gaming-active');
        }

        document.getElementById(tabName).classList.add('active');
        event.target.classList.add('active');
    }

    // --- Core Telegram Logic ---
    async function sendToTelegram(token, chatId, payload) {
        const url = `${TELEGRAM_API}${token}/sendMessage`;
        try {
            const response = await fetch(url, { 
                method: 'POST', 
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload) 
            });
            if(!response.ok) throw new Error("خطا در ارتباط با تلگرام");
            return true;
        } catch (e) { 
            console.error(e);
            throw new Error("خطا در ارسال پیام متنی"); 
        }
    }

    async function sendDocumentToTelegram(token, chatId, fileBlob, fileName, caption) {
        const formData = new FormData();
        formData.append("chat_id", chatId);
        formData.append("caption", caption);
        formData.append("document", fileBlob, fileName);
        
        const url = `https://api.telegram.org/bot${token}/sendDocument`;
        try {
            const response = await fetch(url, { method: 'POST', body: formData });
            if(!response.ok) throw new Error("خطا در ارسال فایل");
            return true;
        } catch (e) {
            console.error(e);
            throw new Error("خطا در آپلود فایل");
        }
    }

    // --- Feature 3: Wygard Creation Logic ---
    async function createWigard(sendToChannel = false) {
        const token = document.getElementById('botToken').value;
        const chatId = document.getElementById('channelId').value;
        const location = document.getElementById('wigardLoc').value;
        const statusBox = document.getElementById('wigardStatusBox');
        
        if (!token || !chatId && sendToChannel) {
            setStatus("لطفا توکن و آیدی کانال را پر کنید.");
            return;
        }

        setStatus(`در حال اتصال به سرورهای Wygard (${location})...`, true);
        statusBox.style.display = 'block';
        statusBox.textContent = "در حال دریافت IP اختصاصی...";

        try {
            // Wygard Public API Endpoint
            const apiUrl = `https://wigard.me/api/v1/create?loc=${location}&type=p2p&protocol=tcp`;
            
            const response = await fetch(apiUrl);
            const data = await response.json();

            if (data.status === "ok" || data.proxy) {
                // Extract details from Wygard response
                const ip = data.ip || data.proxy?.ip;
                const port = data.port || data.proxy?.port;
                const login = data.login || data.proxy?.login;
                const password = data.password || data.proxy?.password;
                
                // Generate .conf content
                const confContent = `[Proxy]
${location}_PUBG = ${location}, ${ip}, ${port}, direct-ip, proxy-type=socks5, username=${login}, password=${password}`;

                const fileName = `wigard_${location}_${Date.now()}.conf`;

                statusBox.textContent = "✅ وایگارد ساخته شد!";
                statusBox.style.color = "#10b981";

                if (sendToChannel) {
                    setStatus("در حال ساخت فایل و ارسال...");
                    
                    // Create Blob and Send
                    const blob = new Blob([confContent], { type: 'text/plain' });
                    await sendDocumentToTelegram(token, chatId, blob, fileName, `🛡️ **وایگارد جدید سبز شد!** 🎮\n\n🌍 **لوکیشن:** ${location}\n⚡ **پینگ تخمینی:** عالی برای پابجی\n✅ **وضعیت:** تست شده و سالم\n⏳ **زمان ساخت:** ${new Date().toLocaleTimeString()}`);
                    
                    setStatus("✅ فایل کانفیگ (.conf) با موفقیت ارسال شد!");
                } else {
                    // Download locally for testing
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = fileName;
                    a.click();
                    setStatus("✅ فایل دانلود شد (بدون ارسال به کانال)");
                }

            } else {
                throw new Error(data.message || "خطا در دریافت وایگارد");
            }

        } catch (error) {
            statusBox.textContent = "❌ خطا: " + error.message;
            statusBox.style.color = "#ef4444";
            setStatus("❌ خطا در ساخت وایگارد");
        }
    }

    function toggleAutoWigard() {
        const intervalMin = parseInt(document.getElementById('wigardInterval').value);
        const checkbox = document.getElementById('autoWigard');
        
        if (autoWigardInterval) {
            clearInterval(autoWigardInterval);
            autoWigardInterval = null;
            setStatus("🔄 ساخت خودکار متوقف شد.");
            checkbox.checked = false;
        } else {
            if (isNaN(intervalMin) || intervalMin < 1) {
                alert("لطفا زمان معتبر وارد کنید.");
                return;
            }
            setStatus(`🔄 ساخت خودکار هر ${intervalMin} دقیقه یکبار فعال شد.`);
            checkbox.checked = true;
            
            // Run immediately once
            createWigard(true);
            
            // Set Interval
            autoWigardInterval = setInterval(() => {
                createWigard(true);
            }, intervalMin * 60 * 1000);
        }
    }

    // --- Feature 1: Scheduled Post ---
    async function schedulePost() {
        const token = document.getElementById('botToken').value;
        const chatId = document.getElementById('channelId').value;
        const text = document.getElementById('postText').value;
        const timeVal = document.getElementById('scheduleTime').value;
        const fileInput = document.getElementById('postFile');

        if (!token || !chatId || !timeVal) {
            setStatus("لطفا توکن، آیدی کانال و زمان را پر کنید.");
            return;
        }

        const targetDate = new Date(timeVal);
        const now = new Date();
        const delay = targetDate - now;

        if (delay < 0) {
            setStatus("زمان انتخابی گذشته است.");
            return;
        }

        setStatus(`در حال انتظار تا ${targetDate.toLocaleTimeString()}...`);

        setTimeout(async () => {
            try {
                if (fileInput.files.length > 0) {
                    const file = fileInput.files[0];
                    const formData = new FormData();
                    formData.append("chat_id", chatId);
                    formData.append("caption", text);
                    formData.append("photo", file);
                    
                    await fetch(`https://api.telegram.org/bot${token}/sendPhoto`, {
                        method: 'POST',
                        body: formData
                    });
                    setStatus("✅ پست با موفقیت انجام شد!");
                } else {
                    await sendToTelegram(token, chatId, { text: text });
                    setStatus("✅ پست متنی با موفقیت انجام شد!");
                }
            } catch (err) {
                setStatus("❌ خطا در ارسال: " + err.message);
            }
        }, delay);
    }

    // --- Feature 2: NoTrack AI News Integration ---
    async function fetchAndPostNews() {
        const topic = document.getElementById('newsTopic').value;
        const apiKey = document.getElementById('noTrackKey').value;
        const token = document.getElementById('botToken').value;
        const chatId = document.getElementById('channelId').value;

        if (!topic || !apiKey || !token) {
            setStatus("لطفا موضوع، API Key و توکن ربات را وارد کنید.");
            return;
        }

        const btn = document.getElementById('newsBtn');
        btn.disabled = true;
        setStatus("در حال جستجو در منابع NoTrack AI...");

        try {
            // Assuming NoTrack API endpoint structure. 
            const response = await fetch(`https://api.ntrack.ai/v1/search?q=${encodeURIComponent(topic)}&key=${apiKey}`, {
                method: 'GET'
            });

            if (!response.ok) throw new Error("خطا در ارتباط با NoTrack AI");

            const data = await response.json();
            
            let newsContent = "";
            if (data.articles && data.articles.length > 0) {
                newsContent = `🔥 آخرین اخبار درباره: ${topic}\n\n`;
                data.articles.slice(0, 3).forEach(article => {
                    newsContent += `📌 ${article.title}\n🔗 ${article.url}\n\n`;
                });
            } else {
                newsContent = `🔥 آخرین وضعیت ${topic}: \n${data.summary || "خبری یافت نشد."}`;
            }

            await sendToTelegram(token, chatId, { text: newsContent });
            setStatus("✅ اخبار بروز با موفقیت منتشر شد!");

        } catch (error) {
            setStatus("❌ خطا: " + error.message);
        } finally {
            btn.disabled = false;
        }
    }

    // Set default time to now + 1 minute for testing
    const now = new Date();
    now.setMinutes(now.getMinutes() + 1);
    document.getElementById('scheduleTime').value = now.toISOString().slice(0,16);
</script>

</body>
</html>
